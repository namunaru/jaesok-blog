<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세계문학 기록실 - 시간의 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif KR', serif;
      overflow-x: hidden;
      background-color: #1a1a2e;
    }

    /* 🌅 시간대별 배경 순환 애니메이션 */
    .homepage-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: -1;
      animation: timeChange 60s ease-in-out infinite;
    }

    @keyframes timeChange {
      0% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_1_Night.png');
      }
      23% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_1_Night.png');
      }
      25% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_2_Dawn.png');
      }
      48% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_2_Dawn.png');
      }
      50% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_3_Day.png');
      }
      73% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_3_Day.png');
      }
      75% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_4_Sunset.png');
      }
      98% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_4_Sunset.png');
      }
      100% {
        background-image: url('C:/Users/front/Pictures/Homepage/Gedsc_TimeFixed_1_Night.png');
      }
    }

    /* 📄 콘텐츠 영역 */
    .content {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 50px 20px;
      text-align: center;
    }

    /* 🏷️ 로고/타이틀 */
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 4rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      text-shadow: 3px 3px 20px rgba(0, 0, 0, 0.7);
      letter-spacing: 3px;
    }

    /* 📝 서브타이틀 */
    .subtitle {
      font-size: 1.3rem;
      color: #f0f0f0;
      margin-bottom: 40px;
      font-weight: 400;
      line-height: 1.8;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
    }

    /* 🔗 네비게이션 */
    .nav-links {
      display: flex;
      gap: 30px;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .nav-links a {
      font-size: 1.1rem;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      transition: all 0.3s ease;
      font-weight: 600;
    }

    .nav-links a:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.2);
    }

    /* 🎯 시간 표시 (데모용 - 필요없으면 삭제) */
    .time-indicator {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px 30px;
      border-radius: 15px;
      font-size: 0.95rem;
      font-family: 'Courier New', monospace;
      z-index: 100;
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .time-indicator strong {
      color: #ffd700;
      font-size: 1.1rem;
    }

    .time-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }

    .time-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #4a90e2, #ffd700);
      animation: timeProgress 60s linear infinite;
    }

    @keyframes timeProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    /* 📱 반응형 디자인 */
    @media (max-width: 768px) {
      .logo {
        font-size: 2.5rem;
      }
      .subtitle {
        font-size: 1rem;
      }
      .nav-links {
        flex-direction: column;
        gap: 15px;
      }
      .time-indicator {
        bottom: 15px;
        right: 15px;
        font-size: 0.8rem;
        padding: 15px 20px;
      }
    }
  </style>
</head>
<body>
  <!-- 🌅 시간 변화 배경 -->
  <div class="homepage-background"></div>

  <!-- 📄 메인 콘텐츠 -->
  <div class="content">
    <h1 class="logo">세계문학 기록실</h1>
    <p class="subtitle">
      기록하고, 사유하고, 찬찬히 공유하는 문학의 흔적<br>
      조용한 세계문학 서재의 Gedsc입니다
    </p>

    <nav class="nav-links">
      <a href="#about">소개</a>
      <a href="#works">작품 리뷰</a>
      <a href="#blog">블로그</a>
      <a href="#contact">문의</a>
    </nav>
  </div>

  <!-- 🎯 시간 표시기 (데모용 - 원하면 삭제하세요) -->
  <div class="time-indicator">
    <strong>🌅 시간의 흐름</strong><br>
    🌙 밤 → 🌄 새벽 → ☀️ 낮 → 🌇 석양<br>
    <div class="time-bar">
      <div class="time-bar-fill"></div>
    </div>
    <small>60초 주기 순환 중...</small>
  </div>
</body>
</html>
